<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Acme CRM</title>
    <link rel="icon" href="/icon.svg" />
    <style>
      :root {
        --ink: #111827;
        --ink-soft: #4b5563;
        --ink-faint: #9ca3af;
        --line: #e5e7eb;
        --paper: #ffffff;
        --wash: #f6f7f9;
        --brand: #2563eb;
        --brand-wash: #eff4ff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
      }

      body {
        background: var(--wash);
        color: var(--ink);
        font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .shell {
        max-width: 1040px;
        margin: 0 auto;
        padding: 28px 24px 56px;
      }

      .topbar {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
      }

      .mark img {
        display: block;
        width: 34px;
        height: 34px;
      }

      .wordmark {
        font-size: 16px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }

      .wordmark span {
        display: block;
        font-size: 11px;
        font-weight: 500;
        color: var(--ink-faint);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .status {
        margin-left: auto;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 5px 11px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--paper);
        font-size: 12px;
        color: var(--ink-soft);
      }

      .status::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--ink-faint);
      }

      .status[data-state="ready"]::before {
        background: #16a34a;
      }

      .status[data-state="down"] {
        border-color: #fcd9a8;
        background: #fffaf1;
        color: #92400e;
      }

      .status[data-state="down"]::before {
        background: #d97706;
      }

      .panes {
        display: grid;
        grid-template-columns: 290px 1fr;
        gap: 20px;
        align-items: start;
      }

      .card {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 12px;
      }

      .card-head {
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
      }

      .card-head h2 {
        margin: 0;
        font-size: 12px;
        font-weight: 650;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ink-soft);
      }

      .count {
        font-size: 12px;
        color: var(--ink-faint);
      }

      .client-list {
        margin: 0;
        padding: 6px;
        list-style: none;
      }

      .client-list button {
        display: block;
        width: 100%;
        padding: 9px 10px;
        border: 0;
        border-radius: 8px;
        background: none;
        font: inherit;
        color: inherit;
        text-align: left;
        cursor: pointer;
      }

      .client-list button:hover {
        background: var(--wash);
      }

      .client-list button[aria-current="true"] {
        background: var(--brand-wash);
      }

      .client-list .name {
        display: block;
        font-weight: 600;
      }

      .client-list .meta {
        display: block;
        font-size: 12px;
        color: var(--ink-faint);
      }

      .detail {
        padding: 22px 24px 24px;
      }

      .detail h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 650;
        letter-spacing: -0.015em;
      }

      .detail .email {
        margin: 4px 0 0;
        color: var(--ink-soft);
      }

      .facts {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 1px;
        margin: 22px 0 0;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--line);
        overflow: hidden;
      }

      .facts div {
        padding: 12px 14px;
        background: var(--paper);
      }

      .facts dt {
        font-size: 11px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--ink-faint);
      }

      .facts dd {
        margin: 3px 0 0;
        font-size: 15px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }

      .notes-head {
        margin: 26px 0 10px;
        font-size: 12px;
        font-weight: 650;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ink-soft);
      }

      .notes {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 8px;
      }

      .notes li {
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-left: 3px solid var(--brand);
        border-radius: 8px;
        background: #fcfcfd;
      }

      .notes time {
        display: block;
        margin-top: 4px;
        font-size: 11px;
        color: var(--ink-faint);
      }

      .flash {
        animation: flash 1.8s ease-out;
      }

      @keyframes flash {
        0%,
        45% {
          background: #fef6da;
          border-color: #f0c657;
        }
        100% {
          background: #fcfcfd;
          border-color: var(--line);
        }
      }

      .empty {
        padding: 14px 0 2px;
        color: var(--ink-faint);
      }

      @media (max-width: 720px) {
        .panes {
          grid-template-columns: 1fr;
        }
      }
    </style>
    <script
      type="module"
      src="https://connectome-gateway.rampalli1.workers.dev/.webmcp/boot.js"
      data-connectome-hub="https://connectome-gateway.rampalli1.workers.dev"
      data-connectome-surface="https://surface.rampalli1.workers.dev"
    ></script>
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <span class="mark"><img src="/icon.svg" alt="" /></span>
        <div class="wordmark">Acme CRM<span>Clients</span></div>
        <p class="status" id="tool-status" data-state="wait">Connecting tools&hellip;</p>
      </header>

      <div class="panes">
        <section class="card" aria-label="Clients">
          <div class="card-head">
            <h2>Clients</h2>
            <span class="count" id="client-count"></span>
          </div>
          <ul class="client-list" id="client-list"></ul>
        </section>

        <section class="card detail" id="detail" aria-live="polite"></section>
      </div>
    </div>
  </body>
</html>
