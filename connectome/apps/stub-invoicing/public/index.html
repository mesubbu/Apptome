<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ledger</title>
    <link rel="icon" href="/icon.svg" />
    <style>
      :root {
        --ink: #0f172a;
        --ink-soft: #475569;
        --ink-faint: #94a3b8;
        --line: #e2e8f0;
        --paper: #ffffff;
        --wash: #f5f7f8;
        --brand: #0f766e;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
      }

      body {
        background: var(--wash);
        color: var(--ink);
        font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .shell {
        max-width: 940px;
        margin: 0 auto;
        padding: 28px 24px 56px;
      }

      .topbar {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 22px;
      }

      .mark img {
        display: block;
        width: 34px;
        height: 34px;
      }

      .wordmark {
        font-size: 16px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }

      .wordmark span {
        display: block;
        font-size: 11px;
        font-weight: 500;
        color: var(--ink-faint);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .status {
        margin-left: auto;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 5px 11px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--paper);
        font-size: 12px;
        color: var(--ink-soft);
      }

      .status::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--ink-faint);
      }

      .status[data-state="ready"]::before {
        background: #16a34a;
      }

      .status[data-state="down"] {
        border-color: #fcd9a8;
        background: #fffaf1;
        color: #92400e;
      }

      .status[data-state="down"]::before {
        background: #d97706;
      }

      .card {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }

      .card-head {
        display: flex;
        align-items: baseline;
        gap: 10px;
        padding: 16px 18px;
        border-bottom: 1px solid var(--line);
      }

      .card-head h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 650;
      }

      .card-head .count {
        font-size: 12px;
        color: var(--ink-faint);
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th {
        padding: 10px 18px;
        border-bottom: 1px solid var(--line);
        background: #fbfcfc;
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ink-faint);
        text-align: left;
      }

      td {
        padding: 13px 18px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }

      tbody tr:last-child td {
        border-bottom: 0;
      }

      .num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      th.num {
        text-align: right;
      }

      .ref {
        font-weight: 650;
        letter-spacing: 0.01em;
      }

      .memo {
        display: block;
        margin-top: 3px;
        max-width: 34ch;
        font-size: 12px;
        color: var(--ink-faint);
      }

      .who {
        display: block;
      }

      .badge {
        display: inline-block;
        padding: 2px 9px;
        border-radius: 999px;
        border: 1px solid #cbd5e1;
        background: #f1f5f9;
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--ink-soft);
      }

      .flash td {
        animation: flash 2.2s ease-out;
      }

      @keyframes flash {
        0%,
        40% {
          background: #fdf3d3;
        }
        100% {
          background: transparent;
        }
      }

      .empty {
        padding: 44px 18px 48px;
        text-align: center;
        color: var(--ink-faint);
      }

      .empty strong {
        display: block;
        margin-bottom: 4px;
        color: var(--ink-soft);
        font-size: 15px;
      }

      .foot {
        margin: 14px 2px 0;
        font-size: 12px;
        color: var(--ink-faint);
      }
    </style>
    <script
      type="module"
      src="https://connectome-gateway.rampalli1.workers.dev/.webmcp/boot.js"
      data-connectome-hub="https://connectome-gateway.rampalli1.workers.dev"
      data-connectome-surface="https://surface.rampalli1.workers.dev"
    ></script>
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <span class="mark"><img src="/icon.svg" alt="" /></span>
        <div class="wordmark">Ledger<span>Invoicing</span></div>
        <p class="status" id="tool-status" data-state="wait">Connecting tools&hellip;</p>
      </header>

      <section class="card">
        <div class="card-head">
          <h1>Invoices</h1>
          <span class="count" id="invoice-count"></span>
        </div>
        <div id="invoice-body" aria-live="polite"></div>
      </section>

      <p class="foot">Drafts are never sent and never charged from this screen.</p>
    </div>
  </body>
</html>
