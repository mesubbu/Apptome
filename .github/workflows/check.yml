name: check

on:
  push:
  pull_request:

jobs:
  distortion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: connectome
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: connectome/pnpm-lock.yaml
      - run: pnpm install
      - run: pnpm check

  deploy:
    needs: distortion
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CONNECTOME_ZONE != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: connectome
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: connectome/pnpm-lock.yaml
      - run: pnpm install
      - run: pnpm deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONNECTOME_ZONE: ${{ vars.CONNECTOME_ZONE }}
          CONNECTOME_GATEWAY_URL: ${{ vars.CONNECTOME_GATEWAY_URL }}
          CONNECTOME_SURFACE_URL: ${{ vars.CONNECTOME_SURFACE_URL }}
          CONNECTOME_MAPPER_URL: ${{ vars.CONNECTOME_MAPPER_URL }}
          CONNECTOME_SPOKE_ORIGINS: ${{ vars.CONNECTOME_SPOKE_ORIGINS }}
