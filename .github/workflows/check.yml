name: check

on:
  push:
  pull_request:

jobs:
  distortion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: connectome
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pnpm check
